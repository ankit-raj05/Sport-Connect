{% extends 'base.html' %}{% block b %}<div class="wrap page" style="max-width:480px"><div class=panel><h2>Complete payment</h2><p>{{b.sessions}} session{{'s' if b.sessions>1}} for <b>{{b.child}}</b></p><h1>₹{{b.amount}}</h1><button id=pb class=lg style="width:100%">Pay securely</button><p class=mute style="font-size:.85rem">Payments are processed by Razorpay. We never see your card or UPI details.</p>
<form id=vf method=post action="/pay/verify"><input type=hidden name=razorpay_payment_id><input type=hidden name=razorpay_order_id><input type=hidden name=razorpay_signature></form></div></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pb').onclick=()=>{new Razorpay({key:"{{key}}",order_id:"{{oid}}",name:"SportsConnect",description:"Coaching sessions",prefill:{name:"{{user.name}}",email:"{{user.email}}"},theme:{color:"#16A36A"},handler:r=>{const f=document.getElementById('vf');for(const k in r)if(f[k])f[k].value=r[k];f.submit()}}).open()}</script>{% endblock %}
